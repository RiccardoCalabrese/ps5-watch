name: Refresh PS5 prices

on:
  workflow_dispatch:
    inputs:
      probe:
        description: 'Optional market/model to self-test instead of a full run (e.g. de/playstation-5)'
        required: false
        default: ''
  # NO SCHEDULE — deliberately.
  #
  # Back Market refuses GitHub's datacenter IPs. Verified 8 Sep 2026: probes for both
  # de/playstation-5 and uk/playstation-5 park on the bot challenge and never clear,
  # while the identical code succeeds from a home connection. An hourly cron here would
  # fail every hour, for ever, and mail a failure notice each time.
  #
  # The scrape therefore runs locally (see README: launchd) and pushes results here;
  # this repo hosts the dashboard and the price history. workflow_dispatch is kept so
  # the block can be re-tested later — if Back Market ever stops blocking cloud IPs,
  # restore the line below and the whole thing runs itself again.
  #   schedule:
  #     - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: google-chrome --version

      # Self-test: prove one page still parses, without touching data.json.
      - name: Probe one product page
        if: inputs.probe != ''
        run: node scrape.mjs --probe "${{ inputs.probe }}"

      - name: Scrape Back Market
        if: inputs.probe == ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scrape.mjs

      - name: Publish if changed
        if: inputs.probe == ''
        run: |
          # data.json and seen.json are generated output. Merging them is never
          # correct, so we never merge: we rebuild the commit on top of remote.
          cp data.json /tmp/fresh.json
          cp seen.json /tmp/seen.json 2>/dev/null || echo '{"alerts":[]}' > /tmp/seen.json
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            cp /tmp/fresh.json data.json
            cp /tmp/seen.json  seen.json
            if git diff --quiet data.json seen.json; then echo "No change."; exit 0; fi
            git add data.json seen.json
            git commit -q -m "refresh: $(date -u '+%Y-%m-%d %H:%M UTC')"
            if git push -q origin HEAD:main; then echo "Published."; exit 0; fi
            echo "Push rejected; rebuilding on top of remote (attempt $i)…"
          done
          echo "Could not publish after 3 attempts." >&2
          exit 1

      - name: Verify published JSON is parseable
        if: inputs.probe == ''
        run: |
          node -e "
            const d = require('./data.json');
            if (!Array.isArray(d.offers)) throw new Error('bad data.json');
            console.log('data.json OK:', JSON.stringify(d.counts));
          "
